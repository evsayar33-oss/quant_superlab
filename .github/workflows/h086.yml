name: H086 — Frozen independent Fama-French + Cboe VIX research
on:
  push:
    branches:
      - research/h086-vix-independent-freeze-20261114
    paths:
      - 'research/h086/**'
      - '.github/workflows/h086.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: 'research/h086:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install bounded dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'PyYAML>=6,<7' 'pytest>=8,<10'
      - name: Verify frozen hypothesis timing, costs and source-integrity rules
        run: python -m pytest -q research/h086/test_h086.py
      - name: Acquire independent official source ZIP/CSV and test 5 frozen models once
        run: python research/h086/h086_run.py --output results/h086
      - name: Preserve pass/fail and all losing-strategy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h086-5-frozen-hypotheses-independent-datasets
          path: results/h086/
          retention-days: 30
          if-no-files-found: warn
