name: H103 — Fixed lower-turnover hypothesis screen (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/h103/**'
      - '.github/workflows/h103.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s research/h101 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/h102 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/h103 -p 'test_*.py' -v
  evidence:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/h103/run.py --pages 8 --out results/h103
      - name: Enforce research-only status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/h103/summary.json').read_text())
          assert r['alpha_accepted'] is False
          assert r['prospective_oos_verified'] is False
          assert r['real_execution_cost_verified'] is False
          assert r['research_complete'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h103-fixed-hypotheses-${{ github.run_id }}
          path: results/h103/
          retention-days: 90
          if-no-files-found: warn
