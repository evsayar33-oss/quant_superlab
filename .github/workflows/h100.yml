name: H100 — Cross-venue robustness screen (read-only)
on:
  push:
    branches: [research/h100-crossvenue-robustness-audit]
    paths: ['research/h100/**', '.github/workflows/h100.yml']
  pull_request:
    paths: ['research/h100/**', '.github/workflows/h100.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest discover -s research/h099 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/h100 -p 'test_*.py' -v
  evidence:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Refresh H099 immutable research input
        run: python research/h099/run.py --pages 8 --out results/h099
      - name: Audit fixed 3-venue consistency without reoptimizing
        run: python research/h100/run.py --source results/h099/summary.json --out results/h100/summary.json
      - name: Enforce no accepted alpha or false OOS and execution claims
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/h100/summary.json")
          if p.exists():
              d=json.loads(p.read_text())
              assert d["alpha_accepted"] is False
              assert d["untouched_oos_verified"] is False
              assert d["independent_execution_verified"] is False
              assert d["research_complete"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h100-crossvenue-robustness-${{ github.run_id }}
          path: |
            results/h099/summary.json
            results/h100/summary.json
          retention-days: 90
          if-no-files-found: warn
