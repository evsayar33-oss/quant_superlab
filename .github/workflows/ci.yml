name: CI
on:
  push:
  pull_request:
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: python tests/test_core.py
      - run: python -m pytest -q tests/test_watch.py tests/test_operational_hardening.py tests/test_data_integrity.py
      - run: python -m pytest -q tests/test_event_study.py tests/test_h079.py tests/test_h080.py tests/test_h081.py
      - run: pip install -r ict/requirements.txt
      - run: cd ict && python -m pytest -q
      - run: python -m unittest discover -s research/h090 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/h091 -p 'test_*.py' -v
      - run: python -m pytest -q research/h083/test_h083.py research/h083/test_h083_robustness.py research/h084/test_h084_recheck.py research/usd_macro/test_usd_macro.py
  terminal:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: terminal}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p server
  bot:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: bots/core3_bot}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python tests/test_bot.py
