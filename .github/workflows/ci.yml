name: CI
on:
  push:
  pull_request:
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: python tests/test_core.py
      - run: pip install -r ict/requirements.txt
      - run: cd ict && python -m pytest -q
  terminal:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: terminal}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p server
  bot:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: bots/core3_bot}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python tests/test_bot.py
