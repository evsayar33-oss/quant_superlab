name: Calibration

# Reproduces known results (Faber SMA200, TSMOM, low-vol, data and look-ahead sanity) on real data.
# Run after every engine change. Output: results/calibration.md on the `results` branch + Telegram.

on:
  workflow_dispatch:
  schedule:
    - cron: '7 3 * * 0'   # Sunday 06:07 TR

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: quant-lab-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python tests/test_core.py
      - run: bash scripts/fetch_results.sh
      - name: Calibrate
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python run.py --calibrate --telegram
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_results.sh
