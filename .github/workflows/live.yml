name: Live tracking

# Weekdays 21:47 TR: paper-track every ACCEPT decision with its frozen variant,
# demote to DEGRADED on decay, rebuild the registry, notify Telegram.

on:
  schedule:
    - cron: '47 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-lab-registry
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Fetch published results (backtest OOS series for the decay test)
        run: bash scripts/fetch_results.sh
      - name: Track
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run.py --live --telegram
      - name: Commit decisions to main
        run: bash scripts/commit_decisions.sh "Live tracking $(date -u +%F)"
