name: H080 — All-sector PIT and regime audit

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First event date"
        required: true
        default: "2019-01-01"
      max_tickers:
        description: "Maximum price tickers"
        required: true
        default: "600"

permissions:
  contents: read

jobs:
  h080:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt tabulate
      - name: Run H080 audit and diagnostics
        run: >-
          python scripts/run_h080.py
          --start "${{ inputs.start }}"
          --max-tickers "${{ inputs.max_tickers }}"
      - uses: actions/upload-artifact@v4
        with:
          name: h080-all-sector-research
          path: results/h080/
          if-no-files-found: error
          retention-days: 90
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
