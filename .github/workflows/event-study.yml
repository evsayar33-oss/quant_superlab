name: H078 — Federal event study

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First event date to include"
        required: true
        default: "2019-01-01"
      max_tickers:
        description: "Maximum tickers with price history"
        required: true
        default: "600"

permissions:
  contents: read

jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run fixed event study
        run: >-
          python scripts/run_event_study.py
          --start "${{ inputs.start }}"
          --max-tickers "${{ inputs.max_tickers }}"
      - uses: actions/upload-artifact@v4
        with:
          name: h078-event-study
          path: results/event_study/
          if-no-files-found: error
          retention-days: 90
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
