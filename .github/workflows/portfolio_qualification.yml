name: Portfolio strategy qualification audit (RESEARCH ONLY)
on:
  workflow_dispatch:
  schedule:
    - cron: '51 6 * * *' # best effort; daily nontrading evidence check
  pull_request:
    paths:
      - 'research/portfolio_qualification/**'
      - '.github/workflows/portfolio_qualification.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/portfolio_qualification.yml'
permissions:
  contents: read
concurrency:
  group: quant-superlab-portfolio-qualification-readonly
  cancel-in-progress: false
jobs:
  evidence-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline source-failure and no-promotion regression
        run: |
          python -m unittest discover -s research/portfolio_qualification -p 'test_*.py' -v
          python -m compileall -q research/portfolio_qualification
      - name: Snapshot public source commits and classify evidence read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m research.portfolio_qualification.audit --out out/portfolio_qualification
          python -m research.portfolio_qualification.synthesis --out out/portfolio_qualification
          cat out/portfolio_qualification/audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Independently reproduce a real source-pinned V7 sample (PR read-only)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from research.portfolio_qualification import eaverse_bridge
          actual=eaverse_bridge.collect('BTCUSDT', token=os.environ.get('GH_TOKEN'))
          assert actual["status"]=="INDEPENDLY_REPRODUCED_HISTORICAL_CSCV_ONLY_NO_ACCEPT".replace("INDEPENDLY","INDEPENDENTLY")
          assert actual["central_lab_accept"] is False
          assert actual["central_lab_backtest_invoked"] is False
          assert actual["reproduced_pbo"]["partitions"] == 70
          assert actual["dsr_independent_replication_complete"] is True
          print("REAL_SOURCE_BTCUSDT_CSCV_DSR_REPRODUCED_NO_ACCEPT",
                actual["reproduced_pbo"]["pbo"],actual["reproduced_approx_dsr"])
          PY
      - name: Reproduce Eaverse V7 empirical PBO with pinned source commits (read-only)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m research.portfolio_qualification.eaverse_bridge \
            --out out/portfolio_qualification/eaverse_bridge.json
          python - <<'PY'
          import json, os
          r=json.load(open("out/portfolio_qualification/eaverse_bridge.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("Eaverse source-SHA-pinned independent CSCV reproduction: " +
                      str(r["reproduced"]) + "/" + str(r["assets_checked"]) +
                      "; central lab ACCEPT granted: 0.\\n")
          PY
      - name: Upload research-only report; no GitHub writes, no Telegram
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qualification-${{ github.run_id }}
          path: out/portfolio_qualification/
          retention-days: 90
          if-no-files-found: warn
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
