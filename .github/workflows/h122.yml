name: H122 — Federal Radar H083 + event-alpha isolated evidence intelligence
on:
  pull_request:
    paths:
      - 'research/h122/**'
      - 'research/bridge_guard.py'
      - '.github/workflows/h122.yml'
  push:
    branches: [main]
    paths:
      - 'research/h122/**'
      - 'research/bridge_guard.py'
      - '.github/workflows/h122.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 3,11,19 * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: quant-superlab-h122-radar-readonly
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify NYSE skip truth, source causality boundaries, H083 and event-alpha isolation
        run: |
          set -euo pipefail
          python -m unittest discover -s research/h122 -p 'test_*.py' -v
          python -m compileall -q research/h122 research/bridge_guard.py
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
  lab_core_regression:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python tests/test_core.py
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
  source_observer:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize isolated H122 evidence worktree (never write Radar data)
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='research/h122-federal-evidence'
          ROOT="$RUNNER_TEMP/h122-state"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git worktree add --detach "$ROOT" "refs/remotes/origin/$BRANCH"
            for file in manifest.json latest.json events.jsonl receipts.jsonl; do
              if [ ! -f "$ROOT/h122/$file" ]; then
                echo "::error::Existing H122 evidence file missing: $file"
                exit 1
              fi
            done
          else
            git worktree add --detach "$ROOT" HEAD
            git -C "$ROOT" checkout --orphan "$BRANCH"
            git -C "$ROOT" rm -rf . >/dev/null
            mkdir -p "$ROOT/h122"
          fi
          echo "H122_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "H122_STATE=$ROOT/h122" >> "$GITHUB_ENV"
      - name: Verify pinned Federal Radar data snapshot and distinguish safe skips
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m research.h122.engine --state "$H122_STATE"
      - name: Persist H122 state before sending alerts
        shell: bash
        run: |
          set -euo pipefail
          git -C "$H122_ROOT" config user.name 'github-actions[bot]'
          git -C "$H122_ROOT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$H122_ROOT" add h122
          if ! git -C "$H122_ROOT" diff --cached --quiet; then
            git -C "$H122_ROOT" commit -m 'research(h122): federal source evidence snapshot [skip ci]'
            git -C "$H122_ROOT" push origin HEAD:refs/heads/research/h122-federal-evidence
          fi
      - name: Alert only new actual forward research milestones or data failures
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -c "from research.bridge_guard import notify_main; notify_main('QS.h122.federal_evidence.v1')" --state "$H122_STATE"
      - name: Persist notification acknowledgements for retry safety
        shell: bash
        run: |
          set -euo pipefail
          git -C "$H122_ROOT" add h122/receipts.jsonl h122/latest.json
          if ! git -C "$H122_ROOT" diff --cached --quiet; then
            git -C "$H122_ROOT" commit -m 'research(h122): acknowledged federal notifications [skip ci]'
            git -C "$H122_ROOT" push origin HEAD:refs/heads/research/h122-federal-evidence
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h122-federal-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/h122-state/h122/latest.json
          retention-days: 90
          if-no-files-found: warn
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
