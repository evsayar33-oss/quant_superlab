name: Synthesis study

# H072 synthesis (config/synthesis.yaml): which published rules beat the US index itself?
# Monthly: new Ken French / AQR / SPY / crypto data, same pre-registered rules, forward record of the
# frozen picks and watch entries (decisions/synthesis/forward.json). Report-only: never writes the registry.
on:
  schedule:
    - cron: "17 6 9 * *"     # 9th of every month (Ken French data updates early in the month)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: synthesis-data-${{ github.run_id }}
          restore-keys: |
            synthesis-data-
            core-data-
      - name: Tests
        run: python tests/test_core.py
      - name: Study
        env:
          LAB_CACHE_HOURS: "0"
        run: python -m lab.synthesis
      - name: Commit result
        run: |
          git config user.name "quant-lab-bot"; git config user.email "actions@users.noreply.github.com"
          cp -r decisions/synthesis /tmp/synthesis_dec
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p decisions/synthesis && cp -r /tmp/synthesis_dec/. decisions/synthesis/
            git add decisions/synthesis
            git diff --cached --quiet && exit 0
            git commit -q -m "Synthesis study $(date -u +%F)" && git push -q origin HEAD:main && exit 0
            sleep 7
          done
