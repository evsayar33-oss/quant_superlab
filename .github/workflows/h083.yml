name: H083 — Multi-style Midas research
on:
  push:
    branches:
      - research/h083-multistyle-test
    paths:
      - 'research/h083/**'
      - '.github/workflows/h083.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h083:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      PYTHONPATH: 'research/h083:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest tabulate
      - name: Verify no-lookahead, execution and fee assumptions
        run: python -m pytest -q research/h083/test_h083.py
      - name: Run full 619-source-event, 44-strategy daily-bar study
        run: >-
          python research/h083/run_h083.py
          --events research/h083/H081_eligible_snapshot.csv
          --output results/h083
      - name: Upload results and data gaps even if research fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h083-midas-multistyle-research
          path: results/h083/
          if-no-files-found: warn
