name: H115 — 180-day H114 forward paper
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [start, tick]
        required: true
        default: start
        description: "start ONCE on main; ticks normally scheduled"
  # Four distributed chances across NY daytime (DST and standard time).
  # GitHub cron is best-effort and may start hours late; only genuine
  # within-session observations can enter the frozen research ledger.
  schedule:
    - cron: '30 14,16,18,20 * * 1-5'
  pull_request:
    paths:
      - 'research/h115/**'
      - '.github/workflows/h115.yml'
permissions:
  contents: write
concurrency:
  group: h115-paper-global
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install prerequisites
        run: pip install numpy pandas scipy pyyaml yfinance
      - name: Offline evidence integrity and causal execution regression
        run: python -m unittest discover -s research/h115 -p 'test_*.py' -v
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
  paper:
    if: github.event_name != 'pull_request'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy pyyaml yfinance
      - name: Recover H115-only durable evidence
        run: |
          mkdir -p results/h115
          if git ls-remote --exit-code origin refs/heads/paper/h115-180d >/dev/null 2>&1; then
            git fetch origin refs/heads/paper/h115-180d:refs/remotes/origin/paper/h115-180d
            git show origin/paper/h115-180d:state.json > results/h115/state.json
          fi
      - name: Prospective observation (strictly no orders)
        env:
          MODE: ${{ github.event_name == 'schedule' && 'tick' || inputs.mode }}
        run: python -m research.h115.forward --mode "$MODE" --state results/h115/state.json --out results/h115/report
      - name: Persist only dedicated paper branch; preserve existing history
        run: |
          if [ ! -f results/h115/state.json ]; then
            echo "No active H115 experiment: schedule cannot auto-start."
            exit 0
          fi
          cp results/h115/state.json /tmp/h115-state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/heads/paper/h115-180d >/dev/null 2>&1; then
            git checkout -B paper/h115-180d origin/paper/h115-180d
          else
            git checkout --orphan paper/h115-180d
            git rm -rf . >/dev/null
          fi
          cp /tmp/h115-state.json state.json
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'H115 prospective paper evidence'
            git push origin HEAD:refs/heads/paper/h115-180d
          fi
      - name: Fail workflow for any missing market evidence (after durable state commit)
        run: |
          if [ -f results/h115/report/execution_status.txt ] && grep -q OUTAGE results/h115/report/execution_status.txt; then
            echo 'Prospective observation failed closed; outage committed to paper branch.'
            exit 1
          fi
      - name: Reject prolonged silent zero-session PAPER status
        run: |
          python - <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import pandas as pd
          p=Path('results/h115/state.json')
          if not p.exists():
              sys.exit('H115_NO_PAPER_STATE')
          st=json.loads(p.read_text())
          now=datetime.now(timezone.utc)
          local=now.astimezone(ZoneInfo('America/New_York'))
          sessions=len(st.get('records',[]))
          started=pd.Timestamp(st['started_at']).date().isoformat()
          weekdays=max(0,len(pd.bdate_range(started,now.date().isoformat()))-1)
          if not sessions and weekdays>=3 and local.weekday()<5 and local.hour>=16:
              sys.exit('H115_STALLED: 3+ weekdays since start; no observed session. '
                       'GitHub job may have fired outside the eligible NY window.')
          print('H115_SESSIONS', sessions, 'NY_CLOCK',local.strftime('%Y-%m-%dT%H:%M'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h115-180d-paper-${{ github.run_id }}
          path: results/h115/report/
          retention-days: 90
          if-no-files-found: warn
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
