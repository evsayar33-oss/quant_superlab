name: H098 — Independent venue and cost evidence (read-only)
on:
  push:
    branches:
      - research/h098-crossvenue-cost-prospective
    paths:
      - 'research/h098/**'
      - '.github/workflows/h098.yml'
  pull_request:
    paths:
      - 'research/h098/**'
      - '.github/workflows/h098.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
concurrency:
  group: h098-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s research/h095 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/h096 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/h097 -p 'test_*.py' -v
      - run: python -m unittest discover -s research/h098 -p 'test_*.py' -v
  evidence:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only independent venue comparison and cost sensitivity
        run: python research/h098/run.py --pages 8 --out results/h098
      - name: Enforce no alpha acceptance
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/h098/summary.json")
          if p.exists():
              d=json.loads(p.read_text())
              assert d["alpha_accepted"] is False
              assert d["production_modified"] is False
              assert d["h089_modified"] is False
              assert d["gates"]["prospective_persistence_verified"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h098-venue-cost-prospective-${{ github.run_id }}
          path: results/h098/
          retention-days: 90
          if-no-files-found: warn
