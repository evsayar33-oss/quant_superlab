# Capital protection diagnostic: shared by the arena study (crypto) and EVERY hypothesis report (any market).
# Written BEFORE any result was seen. Changing a threshold needs a line in hypotheses/CHANGELOG.md.
# The diagnostic never changes a strategy or a decision: it shows what each protection rule would have
# done in real crashes, and whether it passes `accept`. To USE a rule in a hypothesis, register it as an
# overlay (`overlays: [dd20]`) and let the gate judge it.

tests:
  dd_brake: [[0.08, 0.16], [0.10, 0.20], [0.12, 0.25]]  # half size below -a, flat below -b (from the peak)
  vol_target: [0.10, 0.15, 0.25]                        # stocks/metals: annual vol target (crypto uses its own below)
  equity_ma: [30, 60, 90]                               # flat while equity is below its N-day average
  daily_limit: [0.03, 0.05, 0.07]                       # after a loss of x in one day: sit out the next day
  market_guard: [0.04, 0.06, 0.08]                      # market index falls > x in one day -> flat for one day
by_market:
  crypto:
    vol_target: [0.25, 0.35, 0.50]
    market_guard: [0.08, 0.10, 0.15]
    daily_limit: [0.04, 0.05, 0.07]

accept:
  min_crises_better_frac: 0.67   # max drawdown less deep in >= 2/3 of the crises the data covers
  must_lower_full_dd: true
  max_sharpe_drop: 0.10
  max_cagr_drop: 0.25
monte_carlo: {paths: 2000, years: 1, block_days: 10, ruin_dd: -0.50}

# Real crash windows per market (inclusive dates). Checked against news reports on 2026-10-17.
