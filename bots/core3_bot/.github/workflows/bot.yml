name: Core3 bot
# Every 4h, 7 minutes after the bar closes (UTC). Dry run unless the repo variable LIVE is "1".
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: core3-bot, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python tests/test_bot.py
      - name: Bot
        env:
          LIVE: ${{ vars.LIVE }}
          BITGET_KEY: ${{ secrets.BITGET_KEY }}
          BITGET_SECRET: ${{ secrets.BITGET_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: python -m bot.run
      - name: Save state
        run: |
          git config user.name "core3-bot"; git config user.email "actions@users.noreply.github.com"
          git add state; git diff --cached --quiet || (git commit -q -m "state $(date -u +%F_%H%M)" && git push -q)
